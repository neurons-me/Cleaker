  <!-- .GUI (this.gui@4.2.1: GUI.QRme for cleaker.me, then the Docs and Tests cards) renders this page from the static markup below (assets/landing-gui/landing-gui.js, a copy of
       /.me/assets/landing-gui/landing-gui.js); the static page stays as the no-JS / CDN-failure fallback.
       Page-scoped theme keys, neurons.me, dark by default. -->
  <script>
    window.__thisGuiThemeScope = { scopeId: "cleaker", themeModeKey: "cleaker.themeMode", themeIdKey: "cleaker.themeId", defaultMode: "dark" };
    try {
      if (!localStorage.getItem("cleaker.themeMode")) localStorage.setItem("cleaker.themeMode", "dark");
      if (!localStorage.getItem("cleaker.themeId")) localStorage.setItem("cleaker.themeId", "neurons.me");
    } catch (e) {}
    document.documentElement.classList.add("gui-boot");
  </script>
  <style>.material-symbols-rounded,.material-symbols-outlined,.material-icons{display:none!important} body{margin:0} .gui-boot #static-landing{display:none}</style>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/this.gui@4.2.1/dist/this.gui.umd.js" integrity="sha384-hMM5lKGHIJVSKMQgLKFJCTZNMwCQ7XHWcMHCiiTwDFzA0a2q4p0crD/NyA9Pg7wb" crossorigin="anonymous"></script>
  <style>
    html:not(.gui-on) body { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; background:#0b1114; color:#e8eded; }
    html:not(.gui-on) .topnav { display:flex; align-items:center; gap:10px; padding:0 20px; min-height:48px; border-bottom:1px solid rgba(232,237,237,0.08); }
    html:not(.gui-on) .topnav a { color:inherit; text-decoration:none; }
    html:not(.gui-on) .topnav .logo img { width:28px; height:28px; display:block; }
    html:not(.gui-on) .mepath { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; }
    html:not(.gui-on) .mepath a { color:#4fb3bf; }
    html:not(.gui-on) .mepath .here { font-weight:600; }
    html:not(.gui-on) .spacer { flex:1; }
    html:not(.gui-on) .root-cards a { display:block; margin:12px 0; padding:12px; border:1px solid rgba(232,237,237,0.15); border-radius:12px; color:inherit; text-decoration:none; } html:not(.gui-on) .root-cards svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; } html:not(.gui-on) .page { max-width:560px; margin:48px auto; padding:0 16px; font-family: ui-monospace, monospace; }
  </style>
</head>

<div id="static-landing" data-layout="cleaker">

    <div class="mepath"><a href="https://neurons-me.github.io/.me/" title=".me">me://</a><span class="here" aria-current="page">Cleaker</span></div>
    <span class="spacer"></span>

      <a class="card" href="/Cleaker/tests/"><svg class="card-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5c5-2.5 13-2.5 18 0"/><path d="M3.5 11.5c5-4.5 12-4.5 17 0c-5 4.5-12 4.5-17 0z"/><circle cx="12" cy="11.5" r="2"/><path d="M10 15.2 8 20.5M14 15.2c.5 3 4 4 4.5 1.5"/></svg><span class="card-title">Tests</span></a>

</div>

<script src="/Cleaker/assets/landing-gui/landing-gui.js?v=3" onerror="document.documentElement.classList.remove('gui-boot')"></script>
