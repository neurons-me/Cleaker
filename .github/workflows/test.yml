name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: Typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No package-lock.json is committed for Typescript/, so `npm ci` is not available.
      - name: Install
        run: npm install --no-audit --no-fund

      # Tests run straight from source with tsx; no build is needed.
      - name: Test
        run: npm test
